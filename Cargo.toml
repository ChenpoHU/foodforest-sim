[workspace]
resolver = "3"
members = [
    "crates/ff-common",
    "crates/ff-voxel",
    "crates/ff-protocol",
    "crates/ff-ecs",
    "crates/ff-server",
    "crates/ff-client-wasm",
    "crates/ff-shard-manager",
    "crates/ff-tools",
]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }

# Async runtime (server-side)
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

# WASM bridge
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "ErrorEvent",
    "CloseEvent",
] }

# ECS
hecs = "0.10"

# Math
glam = { version = "0.29", features = ["serde"] }

# Utilities
rand = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

# GeoTiff / Voxel (existing deps)
geo = "0.32"
ndarray = "0.17"
tiff = "0.11"
