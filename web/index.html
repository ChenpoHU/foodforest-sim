<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Food Forest Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a0f; font-family: system-ui, sans-serif; }
        canvas { display: block; }

        /* HUD overlay */
        #hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            pointer-events: none;
            z-index: 100;
        }
        #status {
            position: fixed;
            top: 12px; left: 12px;
            color: #8f8;
            font-size: 13px;
            font-family: monospace;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
        }
        #toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            pointer-events: all;
        }
        #toolbar button {
            background: rgba(30,60,30,0.85);
            color: #cfc;
            border: 1px solid #4a4;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #toolbar button:hover { background: rgba(40,100,40,0.9); }
        #toolbar button.active { background: rgba(60,140,60,0.9); border-color: #8f8; }

        #chat {
            position: fixed;
            bottom: 80px; left: 12px;
            width: 300px;
            pointer-events: all;
        }
        #chat-log {
            background: rgba(0,0,0,0.5);
            color: #ccc;
            font-size: 12px;
            padding: 8px;
            border-radius: 6px 6px 0 0;
            max-height: 150px;
            overflow-y: auto;
        }
        #chat-input {
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 1px solid #444;
            border-radius: 0 0 6px 6px;
            padding: 6px 8px;
            font-size: 12px;
            outline: none;
        }

        #minimap {
            position: fixed;
            top: 12px; right: 12px;
            width: 160px; height: 160px;
            border: 2px solid rgba(100,200,100,0.4);
            border-radius: 8px;
            background: rgba(0,20,0,0.6);
        }

        #connect-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1f0a, #1a0a0a);
            z-index: 200;
        }
        #connect-screen h1 {
            color: #6d6;
            font-size: 42px;
            margin-bottom: 8px;
        }
        #connect-screen p {
            color: #888;
            margin-bottom: 24px;
        }
        #connect-screen input {
            background: #1a2a1a;
            color: #cfc;
            border: 1px solid #4a4;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            width: 280px;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
        }
        #connect-screen button {
            background: #2a5a2a;
            color: #cfc;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 16px;
            cursor: pointer;
        }
        #connect-screen button:hover { background: #3a7a3a; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <!-- Connect screen -->
    <div id="connect-screen">
        <h1>Food Forest</h1>
        <p>Multiplayer ecosystem simulation</p>
        <input id="player-name" type="text" placeholder="Your name" value="Farmer" />
        <input id="server-url" type="text" placeholder="Server URL" value="ws://localhost:9000" />
        <button id="connect-btn">Enter World</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="status">Connecting...</div>
        <canvas id="minimap"></canvas>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
        <button data-action="plant-chestnut">Chestnut</button>
        <button data-action="plant-fig">Fig</button>
        <button data-action="plant-rosemary">Rosemary</button>
        <button data-action="plant-comfrey">Comfrey</button>
        <button data-action="plant-clover">Clover</button>
        <button data-action="build-swale">Swale</button>
        <button data-action="build-hugel">Hugel Bed</button>
        <button data-action="water">Water</button>
        <button data-action="harvest">Harvest</button>
        <button data-action="cut-tree">Cut Tree</button>
    </div>

    <!-- Chat -->
    <div id="chat">
        <div id="chat-log"></div>
        <input id="chat-input" type="text" placeholder="Press Enter to chat..." />
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
