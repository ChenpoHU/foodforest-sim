<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Food Forest Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a0f; font-family: system-ui, sans-serif; }
        canvas { display: block; }

        /* HUD overlay */
        #hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            pointer-events: none;
            z-index: 100;
        }
        #status {
            position: fixed;
            top: 12px; left: 12px;
            color: #8f8;
            font-size: 13px;
            font-family: monospace;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
        }
        #toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            pointer-events: all;
        }
        #toolbar button {
            background: rgba(30,60,30,0.85);
            color: #cfc;
            border: 1px solid #4a4;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #toolbar button:hover { background: rgba(40,100,40,0.9); }
        #toolbar button.active { background: rgba(60,140,60,0.9); border-color: #8f8; }

        #chat {
            position: fixed;
            bottom: 80px; left: 12px;
            width: 300px;
            pointer-events: all;
        }
        #chat-log {
            background: rgba(0,0,0,0.5);
            color: #ccc;
            font-size: 12px;
            padding: 8px;
            border-radius: 6px 6px 0 0;
            max-height: 150px;
            overflow-y: auto;
        }
        #chat-input {
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 1px solid #444;
            border-radius: 0 0 6px 6px;
            padding: 6px 8px;
            font-size: 12px;
            outline: none;
        }

        #minimap {
            position: fixed;
            top: 12px; right: 12px;
            width: 200px; height: 200px;
            border: 2px solid rgba(100,200,100,0.4);
            border-radius: 8px;
            background: rgba(0,20,0,0.6);
            cursor: pointer;
            pointer-events: all;
        }

        #connect-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1f0a, #1a0a0a);
            z-index: 200;
        }
        #connect-screen h1 {
            color: #6d6;
            font-size: 42px;
            margin-bottom: 8px;
        }
        #connect-screen p {
            color: #888;
            margin-bottom: 24px;
        }
        #connect-screen input {
            background: #1a2a1a;
            color: #cfc;
            border: 1px solid #4a4;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            width: 280px;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
        }
        #connect-screen button {
            background: #2a5a2a;
            color: #cfc;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 16px;
            cursor: pointer;
        }
        #connect-screen button:hover { background: #3a7a3a; }

        #country-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 8px 0;
            max-width: 700px;
        }
        .country-btn {
            background: #1a2a1a;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .country-btn:hover { background: #2a3a2a; border-color: #4a4; }
        .country-btn.active { background: #2a5a2a; color: #cfc; border-color: #8f8; }
        #region-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 6px 0;
            max-width: 600px;
        }
        .region-btn {
            background: #1a2a1a;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .region-btn:hover { background: #2a3a2a; border-color: #4a4; }
        .region-btn.active { background: #2a5a2a; color: #cfc; border-color: #8f8; }
        #plot-selector {
            display: none;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
        }
        #plot-selector label { color: #888; font-size: 12px; }
        #plot-seed-input {
            background: #1a2a1a;
            color: #cfc;
            border: 1px solid #4a4;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            width: 80px;
            text-align: center;
            outline: none;
        }
        #world-canvas {
            border: 1px solid rgba(100,200,100,0.3);
            border-radius: 8px;
            cursor: crosshair;
            margin: 8px 0;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <!-- Connect screen -->
    <div id="connect-screen">
        <h1>Food Forest</h1>
        <p>Global ecosystem simulation</p>
        <div style="display:flex; gap:12px; align-items:center; margin-bottom:4px;">
            <input id="player-name" type="text" placeholder="Your name" value="Farmer" />
            <input id="server-url" type="text" placeholder="Server URL" value="ws://localhost:9000" />
        </div>
        <div style="display:flex; gap:8px; margin: 6px 0;">
            <button class="mode-btn active" data-mode="0" style="background:#2a5a2a; color:#cfc; border:1px solid #4a4; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer;">Peaceful</button>
            <button class="mode-btn" data-mode="1" style="background:#1a2a1a; color:#aaa; border:1px solid #444; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer;">Survival</button>
            <button class="mode-btn" data-mode="2" style="background:#1a2a1a; color:#aaa; border:1px solid #444; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer;">Hardcore</button>
        </div>
        <p id="mode-desc" style="color:#888; font-size:11px; margin-bottom:4px; max-width:420px; text-align:center;">No casualties. Trees disappear when cut. Relaxed pace for all ages.</p>

        <canvas id="world-canvas" width="700" height="320"></canvas>

        <div id="country-bar"></div>
        <div id="region-list"></div>

        <div id="plot-selector">
            <label for="plot-seed-input">Plot parcel (5 ha):</label>
            <input id="plot-seed-input" type="number" value="42" min="1" max="9999" />
            <span style="color:#666; font-size:11px;">Each number generates a unique parcel</span>
        </div>

        <button id="connect-btn" style="margin-top:8px;">Enter World</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="status">Connecting...</div>
        <canvas id="minimap"></canvas>
        <button id="world-nav-btn" style="position:fixed; top:218px; right:12px; width:200px; background:rgba(30,60,30,0.85); color:#cfc; border:1px solid #4a4; border-radius:0 0 8px 8px; padding:4px; font-size:11px; cursor:pointer; pointer-events:all; z-index:101;">Travel to Region</button>
    </div>

    <!-- World navigation overlay -->
    <div id="world-nav-overlay" style="position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); z-index:300; pointer-events:all;">
        <div style="text-align:center;">
            <h2 style="color:#6d6; margin-bottom:8px;">Travel to Region</h2>
            <p style="color:#888; font-size:12px; margin-bottom:12px;">Select a country and region to explore</p>
            <canvas id="nav-world-canvas" width="700" height="320" style="border:1px solid rgba(100,200,100,0.3); border-radius:8px; cursor:crosshair; margin-bottom:8px;"></canvas>
            <div id="nav-country-bar" style="display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:8px 0; max-width:700px;"></div>
            <div id="nav-region-list" style="display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:6px 0; max-width:600px;"></div>
            <div style="margin-top:10px; display:flex; gap:10px; justify-content:center;">
                <button id="nav-travel-btn" style="background:#2a5a2a; color:#cfc; border:none; border-radius:8px; padding:10px 28px; font-size:15px; cursor:pointer;">Travel</button>
                <button id="nav-cancel-btn" style="background:#333; color:#aaa; border:1px solid #555; border-radius:8px; padding:10px 28px; font-size:15px; cursor:pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Player status -->
    <div id="player-hud" style="position:fixed; top:50px; left:12px; color:#cfc; font-size:12px; font-family:monospace; background:rgba(0,0,0,0.6); padding:8px 12px; border-radius:6px; display:none; pointer-events:none;">
        <div id="hud-name"></div>
        <div id="hud-stamina"></div>
        <div id="hud-hunger"></div>
    </div>

    <!-- Edge direction hints -->
    <div id="edge-hints" style="position:fixed; pointer-events:none; z-index:100; display:none;">
        <div id="hint-north" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); top:40px; color:rgba(200,255,200,0.5); font-size:11px; font-family:monospace; text-align:center;"></div>
        <div id="hint-south" style="position:fixed; bottom:85px; left:50%; transform:translateX(-50%); color:rgba(200,255,200,0.5); font-size:11px; font-family:monospace; text-align:center;"></div>
        <div id="hint-west" style="position:fixed; top:50%; left:12px; transform:translateY(-50%); color:rgba(200,255,200,0.5); font-size:11px; font-family:monospace;"></div>
        <div id="hint-east" style="position:fixed; top:50%; right:220px; transform:translateY(-50%); color:rgba(200,255,200,0.5); font-size:11px; font-family:monospace; text-align:right;"></div>
    </div>

    <!-- Inspect panel -->
    <div id="inspect-panel" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:240px; color:#eee; font-size:13px; font-family:monospace; background:rgba(0,20,0,0.9); padding:14px; border-radius:10px; border:1px solid #4a4; display:none; pointer-events:all; z-index:150; box-shadow:0 4px 24px rgba(0,0,0,0.5);">
        <div id="inspect-content"></div>
        <button onclick="document.getElementById('inspect-panel').style.display='none'" style="margin-top:8px; background:#333; color:#aaa; border:1px solid #555; border-radius:4px; padding:3px 10px; cursor:pointer; font-size:11px;">Close</button>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
        <button data-action="plant-chestnut">Chestnut</button>
        <button data-action="plant-olive">Olive</button>
        <button data-action="plant-fig">Fig</button>
        <button data-action="plant-lavender">Lavender</button>
        <button data-action="plant-rosemary">Rosemary</button>
        <button data-action="plant-comfrey">Comfrey</button>
        <button data-action="plant-clover">Clover</button>
        <button data-action="build-swale">Swale</button>
        <button data-action="build-hugel">Hugel Bed</button>
        <button data-action="water">Water</button>
        <button data-action="harvest">Harvest</button>
        <button data-action="cut-tree">Cut Tree</button>
        <button data-action="inspect">Inspect</button>
    </div>

    <!-- Chat -->
    <div id="chat">
        <div id="chat-log"></div>
        <input id="chat-input" type="text" placeholder="Press Enter to chat..." />
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
